# Ansible Inventory — Lab Environment
# These hostnames resolve inside the Docker lab network.

[app_servers]
app-node-1 ansible_host=app-node-1
app-node-2 ansible_host=app-node-2

[app_servers:vars]
ansible_user=deploy
ansible_ssh_private_key_file=/root/.ssh/lab_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3

# App-specific vars
app_dir=/srv/app
app_service=fastapi-app
app_port=8000
app_repo=https://github.com/your-org/your-app.git  # swap in your real repo
app_branch=main
